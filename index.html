<script>

const SMARTPAY_URL =
  "https://zxforhokpsiqkceesalk.supabase.co/functions/v1/payhero";

const tickets = [
  {
    name: "Regular",
    price: 1000,
    icon: "🎫"
  },
  {
    name: "VIP",
    price: 2000,
    icon: "👑"
  },
  {
    name: "VVIP",
    price: 5000,
    icon: "💎"
  },
  {
    name: "VIP Group",
    price: 9000,
    icon: "👥"
  }
];

let selectedTicket = null;
let paymentPolling = null;
let paymentStartedAt = 0;


/* ================================
   TICKETS
================================ */

const ticketContainer =
  document.getElementById("tickets");

tickets.forEach((ticket, index) => {

  const card = document.createElement("article");

  card.className = "ticket";

  card.innerHTML = `
    <div class="ticket-icon">
      ${ticket.icon}
    </div>

    <div class="ticket-name">
      ${ticket.name}
    </div>

    <div class="ticket-price">
      KSH ${ticket.price.toLocaleString()}
    </div>
  `;

  card.onclick = () => {

    document
      .querySelectorAll(".ticket")
      .forEach(x => x.classList.remove("selected"));

    card.classList.add("selected");

    selectedTicket = ticket;

    document
      .getElementById("checkout")
      .classList.add("show");

    document.getElementById("summary").textContent =
      `${ticket.name} • KSH ${ticket.price.toLocaleString()}`;

    document
      .getElementById("checkout")
      .scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
  };

  ticketContainer.appendChild(card);

});


/* ================================
   CHECKOUT STEPS
================================ */

function nextStep(step) {

  if (step === 2) {

    const name =
      document.getElementById("fullName").value.trim();

    if (!name) {
      alert("Enter your full name.");
      return;
    }

  }

  if (step === 3) {

    const email =
      document.getElementById("email").value.trim();

    if (!email) {
      alert("Enter your Gmail address.");
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      alert("Enter a valid Gmail address.");
      return;
    }

  }

  document
    .querySelectorAll(".form-step")
    .forEach(x => x.classList.remove("active"));

  document
    .getElementById("step" + step)
    .classList.add("active");

  document.getElementById("stepLabel").textContent =
    `STEP ${step} OF 3`;

  document.getElementById("formTitle").textContent =
    step === 2
      ? "Your Gmail"
      : "M-PESA payment";

}


/* ================================
   PHONE VALIDATION
================================ */

function validKenyanPhone(phone) {

  phone = phone.replace(/\s+/g, "");

  return /^(?:254|0)?[17]\d{8}$/.test(phone);

}


/* ================================
   PAYMENT
================================ */

async function startPayment() {

  if (!selectedTicket) {
    alert("Select a ticket first.");
    return;
  }

  const name =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  if (!validKenyanPhone(phone)) {

    alert(
      "Enter a valid Kenyan M-PESA number."
    );

    return;
  }

  await initiatePayment({

    name,
    email,
    phone,

    amount:
      selectedTicket.price,

    ticketType:
      selectedTicket.name,

    description:
      "CHING'ENDE " +
      selectedTicket.name

  });

}


/* ================================
   DONATION
================================ */

async function startDonation() {

  const amount =
    Number(
      document.getElementById(
        "donationAmount"
      ).value
    );

  if (!amount || amount < 1) {

    alert("Enter a valid donation amount.");

    return;
  }

  const phone =
    document.getElementById("phone").value.trim();

  const name =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("email").value.trim();

  if (!phone || !validKenyanPhone(phone)) {

    alert(
      "Enter your M-PESA number in the checkout form first."
    );

    document
      .getElementById("checkout")
      .classList.add("show");

    document
      .getElementById("checkout")
      .scrollIntoView({
        behavior: "smooth"
      });

    return;
  }

  await initiatePayment({

    name: name || "Donor",

    email: email || "",

    phone,

    amount,

    ticketType: "Donation",

    description: "CHING'ENDE Donation"

  });

}


/* ================================
   INITIATE PAYMENT
================================ */

async function initiatePayment(data) {

  showWaiting();

  const reference =
    "CHG-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 7);

  try {

    const response =
      await fetch(
        SMARTPAY_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            phone: data.phone,

            amount: data.amount,

            account_reference:
              reference,

            description:
              data.description,

            name:
              data.name,

            email:
              data.email,

            ticket_type:
              data.ticketType,

            quantity: 1

          })
        }
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      let message =
        result.error ||
        result.message ||
        "Unable to start M-PESA payment.";

      if (
        result.error_code ===
        "LIMIT_REACHED"
      ) {

        message =
          "M-PESA is temporarily unavailable. Please use till number 4674059.";

      }

      showError(message);

      return;
    }


    paymentStartedAt =
      Date.now();


    startPaymentPolling(

      result.reference ||
      reference,

      result.checkout_request_id

    );


  } catch (error) {

    console.error(error);

    showError(
      "Network error. Please check your connection and try again."
    );

  }

}


/* ================================
   WAITING MODAL
================================ */

function showWaiting() {

  const modal =
    document.getElementById(
      "paymentModal"
    );

  modal.classList.add("show");

  document
    .getElementById("spinner")
    .classList.remove("hidden");

  document
    .getElementById("retryButton")
    .classList.add("hidden");

  document
    .getElementById("paymentStatus")
    .className = "status";

  document
    .getElementById("paymentStatus")
    .textContent =
      "Waiting for M-PESA";

  document
    .getElementById("paymentText")
    .textContent =
      "Check your phone and enter your M-PESA PIN.";

}


/* ================================
   POLLING
================================ */

function startPaymentPolling(
  reference,
  checkoutRequestId
) {

  clearInterval(paymentPolling);

  paymentPolling =
    setInterval(
      async () => {

        /* 3 MINUTE TIMEOUT */

        if (
          Date.now() -
          paymentStartedAt >
          180000
        ) {

          showError(
            "Payment status timed out. Check your M-PESA messages and try again."
          );

          return;
        }


        try {

          let query;

          if (checkoutRequestId) {

            query =
              "checkout_request_id=" +
              encodeURIComponent(
                checkoutRequestId
              );

          } else {

            query =
              "reference=" +
              encodeURIComponent(
                reference
              );

          }


          const response =
            await fetch(
              SMARTPAY_URL +
              "?" +
              query
            );


          const result =
            await response.json();


          console.log(
            "Payment status:",
            result
          );


          if (
            result.status ===
            "completed"
          ) {

            showSuccess();

          }

          else if (
            result.status ===
            "cancelled"
          ) {

            showError(
              "Payment cancelled."
            );

          }

          else if (
            result.status ===
            "failed"
          ) {

            showError(
              "Payment failed. Please try again."
            );

          }

        } catch (error) {

          console.error(
            "Status check error:",
            error
          );

          /*
            IMPORTANT:
            Do NOT stop polling on temporary
            network errors.
          */

        }

      },

      3000

    );

}


/* ================================
   SUCCESS
================================ */

function showSuccess() {

  clearInterval(
    paymentPolling
  );

  document
    .getElementById("spinner")
    .classList.add("hidden");

  document
    .getElementById("paymentStatus")
    .className =
      "status success";

  document
    .getElementById("paymentStatus")
    .textContent =
      "Payment successful ✓";

  document
    .getElementById("paymentText")
    .textContent =
      "Check your Gmail inbox for your ticket.";

  document
    .getElementById("retryButton")
    .classList.add("hidden");

}


/* ================================
   ERROR / CANCELLED
================================ */

function showError(message) {

  clearInterval(
    paymentPolling
  );

  document
    .getElementById("spinner")
    .classList.add("hidden");

  document
    .getElementById("paymentStatus")
    .className =
      "status error";

  document
    .getElementById("paymentStatus")
    .textContent =
      "Payment not completed";

  document
    .getElementById("paymentText")
    .textContent =
      message;

  document
    .getElementById("retryButton")
    .classList.remove("hidden");

}


/* ================================
   CLOSE
================================ */

function closeModal() {

  clearInterval(
    paymentPolling
  );

  document
    .getElementById("paymentModal")
    .classList.remove("show");

}


/* ================================
   COUNTDOWN
================================ */

const eventDate =
  new Date(
    "2026-10-10T18:00:00+03:00"
  ).getTime();


function updateTimer() {

  const now =
    Date.now();

  let difference =
    Math.max(
      0,
      eventDate - now
    );


  const days =
    Math.floor(
      difference /
      (1000 * 60 * 60 * 24)
    );

  const hours =
    Math.floor(
      difference /
      (1000 * 60 * 60)
    ) % 24;

  const minutes =
    Math.floor(
      difference /
      (1000 * 60)
    ) % 60;

  const seconds =
    Math.floor(
      difference /
      1000
    ) % 60;


  document.getElementById(
    "timer"
  ).innerHTML = `

    <div class="time-box">
      <span class="time-number">
        ${String(days).padStart(2,"0")}
      </span>
      <span class="time-label">DAYS</span>
    </div>

    <div class="time-box">
      <span class="time-number">
        ${String(hours).padStart(2,"0")}
      </span>
      <span class="time-label">HRS</span>
    </div>

    <div class="time-box">
      <span class="time-number">
        ${String(minutes).padStart(2,"0")}
      </span>
      <span class="time-label">MIN</span>
    </div>

    <div class="time-box">
      <span class="time-number">
        ${String(seconds).padStart(2,"0")}
      </span>
      <span class="time-label">SEC</span>
    </div>

  `;

}


updateTimer();

setInterval(
  updateTimer,
  1000
);

</script>

</body>
